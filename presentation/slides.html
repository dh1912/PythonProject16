    let currentTask = 1;
    let currentSlide = 0;

    function renderSlide() {
        const slides = SLIDES_DATA[currentTask];
        const data = slides[currentSlide];

        document.getElementById("slide-title").innerText = data.title;
        document.getElementById("task-badge").innerText = `TASK ${currentTask}`;
        document.getElementById("slide-content").innerHTML = data.html;
        document.getElementById("slide-counter").innerText = `Slide ${currentSlide + 1} / ${slides.length}`;

        document.getElementById("prev-btn").disabled = (currentSlide === 0);
        document.getElementById("next-btn").disabled = (currentSlide === slides.length - 1);

        setTimeout(() => {
            mermaid.run();
        }, 50);
    }

    function switchTask(taskIndex) {
        currentTask = taskIndex;
        currentSlide = 0;
        document.querySelectorAll(".task-btn").forEach((btn, idx) => {
            btn.classList.toggle("active", idx + 1 === taskIndex);
        });
        renderSlide();
    }

    function prevSlide() {
        if (currentSlide > 0) {
            currentSlide--;
            renderSlide();
        }
    }

    function nextSlide() {
        const slides = SLIDES_DATA[currentTask];
        if (currentSlide < slides.length - 1) {
            currentSlide++;
            renderSlide();
        }
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") prevSlide();
        if (e.key === "ArrowRight") nextSlide();
    });

    // Khởi tạo ban đầu
    renderSlide();
</script>
